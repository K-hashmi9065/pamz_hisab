name: pamz_khata
description: "PAMZ Hisab — Offline-first Udhar Khata & Family Finance for iPad (Kishanganj, Bihar)"
publish_to: 'none'

version: 1.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Responsive Sizing
  flutter_screenutil: ^5.9.3

  # Local DB — SQLite
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Local KV Store
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Models — Immutable / Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Functional: Result/Either
  fpdart: ^1.1.0

  # PDF & Excel Generation
  pdf: ^3.11.1
  printing: ^5.13.1
  excel: ^4.0.6

  # Sharing (WhatsApp/Files/AirDrop)
  share_plus: ^9.0.0

  # URL Launcher (SMS scheme)
  url_launcher: ^6.3.0

  # Biometric Auth
  local_auth: ^2.3.0

  # Secure Storage (Keychain)
  flutter_secure_storage: ^9.2.2

  # Camera / Receipt Photo & Storage
  image_picker: ^1.1.2
  path_provider: ^2.1.4

  # Typography
  google_fonts: ^6.2.1

  # Logging
  logger: ^2.4.0

  # UUID generation
  uuid: ^4.5.0

  # Internationalization
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8
  sqflite_common_ffi: ^2.3.5
  sqflite_common_ffi_web: ^0.4.3+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Integration testing
  integration_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3

  # Mocking
  mocktail: ^1.0.4

  # SQLite FFI for tests (desktop/Windows)

  # Linting
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true   # enables l10n generation from arb files

  assets:
    - assets/images/
    - assets/icons/

  # Fonts are loaded via google_fonts at runtime (no bundled font files needed)
